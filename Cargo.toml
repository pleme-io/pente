[workspace]
resolver = "2"
members = ["pente-spec", "pente-forge"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/pleme-io/pente"
rust-version = "1.89"

[workspace.dependencies]
# tatara-lisp is the documented crates.io EXCEPTION: the canonical lineage
# publishes every workspace member to the registry, so it resolves from there
# for both build and publish with no git spec to strip. See
# escriba/Cargo.toml:114-121 and repo-forge's `defrepo pente`.
#
# `tatara-lisp-derive` is deliberately ABSENT — the lib re-exports the macros
# RENAMED (`DeriveTataraDomain` / `DeriveKeywordSexp`) so they coexist with the
# same-named traits. Naming the derive crate would be a phantom dependency.
tatara-lisp = "0.3"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
strip = true
